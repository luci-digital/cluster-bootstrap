  source: ~/.luci-digital-library/archive-storage/macmini-gitlab/luciverse/platforms/core-platform-v4/
  plan: attached_assets/luciacore-education-plan.md

  deployment_targets:
    cloudflare_workers:
      name: learn-lucidigital
      domain: learn.lucidigital.io
      description: Interactive learning portal (online)
      framework: hono
      assets: true
      status: planned

    pangolin_resource:
      domain: learn.lucidigital.io
      backend: "localhost:8750"
      description: Self-hosted learning portal via Pangolin tunnel
      status: planned

    offline_appliance:
      description: Offline LuciaCore deployment for schools without internet
      target_hardware: [zimacube, dell_fleet_compute]
      components:
        - kiwix_wikipedia       # Offline Wikipedia
        - khan_academy_lite     # Offline Khan Academy
        - gcompris              # Educational games (ages 2-10)
        - scratch               # Visual programming
        - python_mu             # Python IDE
        - geogebra              # Math visualization
        - stellarium            # Astronomy
      container_runtime: docker  # For ZimaOS targets
      status: planned

  features:
    - offline_knowledge_repository
    - classroom_management_system
    - educational_content_creation
    - stem_tools
    - language_learning
    - learning_analytics
    - digital_literacy_curriculum
    - maker_steam_tools
    - teacher_training_materials
    - global_classroom_connections

  integrations:
    gaianet_rag:
      description: AI-powered Q&A from LDS knowledge base
      endpoint: "http://192.168.1.152:8086/v1/chat/completions"
    semantic_engine:
      description: Embedding search for course content
      endpoint: "https://localhost:9528"
    did_verification:
      description: Learner identity via did:web credentials
      endpoint: "https://localhost:8766"
