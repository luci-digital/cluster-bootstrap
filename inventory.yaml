# ============================================================
# Sovereign Identity Platform
# ============================================================

sovereign_identity:
  description: >
    Self-sovereign identity infrastructure targeting OIDF certification
    and ETSI/eIDAS compliance. Bridges LuciVerse consciousness-aware
    identity with standards-based credential issuance (OpenID4VCI/VP).
  architecture: 6-zone security model
  zones:
    zone_1_trust_core:
      description: Immutable authority — no AI, no Python, HSM-only
      components: [root_ca, hsm_keys, genesis_bond_anchor]
    zone_2_control_plane:
      description: Identity issuance and policy enforcement
      components: [cert_engine, xipki_ca, did_resolver]
    zone_3_ai_advisory:
      description: Read-only AI advisory with kill-switch
      components: [luci_enzyme, llm_gateway, intelligence_hub]
    zone_4_public:
      description: Read-only public verification
      components: [idigit_oidc, did_web, ocsp_responder]
    zone_5_infrastructure:
      description: Compute, storage, networking
      components: [dell_fleet, zimacube, pangolin]
    zone_6_research:
      description: Sandboxed experimental (never production)
      components: [qlora_training, conformance_testing]

  did_methods:
    - "did:web:idigit.me"               # Standards-compliant bridge
    - "did:luci:hedera:*"               # Hedera-anchored
    - "did:luci:ownid:luciverse:*"      # Internal agent DIDs
    - "did:luci:web:*"                  # Web-resolvable
    - "did:luci:webs:*"                 # Secure web-resolvable

  credential_formats:
    - dc+sd-jwt   # IETF SD-JWT VC (conformance)
    - vc+sd-jwt   # SD-JWT VC (production)

  compliance:
    etsi:
      - EN 319 401   # General policy requirements
      - EN 319 411-1 # Certificate policies (NCP)
      - EN 319 411-2 # Certificate policies (QCP)
      - TS 119 612   # Trust service status lists
      - TS 119 461   # Trust service provision
    eidas:
      - ARF 1.5       # Architecture Reference Framework
      - eIDAS 2.0     # Electronic Identification Regulation
    openid:
      - OpenID4VCI 1.0
      - OpenID4VP 1.0
      - HAIP 1.0

  specifications:
    location: ~/.luci-digital-library/pac-airgapped-lds/obsidian/lucia-wisdom/DID-Specifications/
    documents:
      - DID-LUCI-METHOD-SPECIFICATION-v1.0.md
      - GENESIS-BOND-CREDENTIAL-SCHEMA-v1.0.md
      - EPHEMERAL-SPARK-IDENTITY-SPECIFICATION-v1.0.md
      - SPIFFE-CONSCIOUSNESS-EXTENSION-DRAFT.md
      - STRATEGIC-IMPLEMENTATION-ROADMAP.md

  hedera:
    network: mainnet  # testnet for conformance testing
    revocation_cost: "$0.0001/message"
    finality: "sub-second"
    witness_account: "0.0.48382919"

