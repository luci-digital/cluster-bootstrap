    idigit_oidc_conformance:
      name: idigit-oidc-conformance
      description: OpenID4VCI/VP conformance engine (HAIP 1.0)
      source: ~/Downloads/idigitme/
      entry: src/index.ts
      domain: idigit.me
      framework: hono
      specs:
        - OpenID4VCI 1.0
        - OpenID4VP 1.0
        - HAIP 1.0
        - SD-JWT VC (draft-ietf-oauth-sd-jwt-vc-08)
        - RFC 9126 (PAR)
        - RFC 9449 (DPoP)
        - RFC 7636 (PKCE S256)
      crypto: ES256 (P-256/ECDSA)
      did_method: "did:web:idigit.me"
      hedera_network: testnet
      hedera_topic: "0.0.3571523"
      credential_types:
        - LuciVerseIdentity          # Consciousness-aware identity
        - PersonIdentificationData   # eIDAS 2.0 PID
      kv_namespaces:
        - NONCE_STORE           # c_nonce (300s TTL)
        - SESSION_STORE         # PAR, auth codes, tokens
        - CREDENTIAL_STORE      # Issued SD-JWT VCs (365d TTL)
        - REVOCATION_STORE      # Hedera HCS revocation cache
        - DID_STORE             # DID Document cache
      durable_objects:
        - IssuerSession         # Stateful PAR sessions (5min cleanup)
      secrets_ref:
        - "op://Lucia-AI-Secrets/idigit-issuer-key/private_key_jwk"
        - "op://Lucia-AI-Secrets/idigit-verifier-key/private_key_jwk"
        - "op://Infrastructure/hedera-operator-key/credential"
      endpoints:
        discovery:
          - /.well-known/openid-credential-issuer
          - /.well-known/oauth-authorization-server
          - /.well-known/did.json
          - /jwks
        issuer:
          - /par
          - /authorize
          - /token
          - /nonce
          - /credential
          - /offer
        verifier:
          - /verifier/request
          - /verifier/response
          - /verifier/result
        revocation:
          - /status
          - /revoke
      certification:
        target_date: 2026-02-26
        body: OpenID Foundation
        fee_usd: 6300
        roles: [issuer, verifier, wallet]
      status: development

    idigit_me_landing:
      name: idigit-me
      description: Production landing page + combined conformance API
      source: ~/Downloads/idigitme/mnt/user-data/outputs/idigit-me-landing/
