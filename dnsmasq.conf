# ============================================================================
# LuciVerse OOB Provisioning Network - dnsmasq
# ============================================================================
# Interface: enp12s0 (Thunderbolt dock Intel I210 GbE)
# Subnet: 10.0.0.0/24
# ZBook: 10.0.0.1 (DHCP server + PXE + TFTP + HTTP gateway)
# Updated: 2026-02-12 - Added Bootimus iPXE chainloading
# ============================================================================

# Only listen on the OOB interface IP (don't conflict with named on 127.0.0.1)
listen-address=10.0.0.1
bind-interfaces
interface=enp12s0
except-interface=lo

# DNS - serve local names only on OOB interface
port=0
local=/oob.lucidigital.net/
domain=oob.lucidigital.net
no-resolv

# DHCP range: 10.0.0.10 - 10.0.0.200, 12h leases
dhcp-range=10.0.0.10,10.0.0.200,255.255.255.0,12h

# Gateway and DNS point to ZBook
dhcp-option=option:router,10.0.0.1
dhcp-option=option:dns-server,10.0.0.1

# NTP server
dhcp-option=option:ntp-server,10.0.0.1

# ---- PXE Boot (Bootimus iPXE Chainload) ----

# TFTP server
enable-tftp
tftp-root=/var/lib/tftpboot

# BIOS PXE boot (arch 0) - chainload to iPXE
dhcp-match=set:bios,option:client-arch,0
dhcp-boot=tag:bios,undionly.kpxe

# UEFI x86_64 PXE boot (arch 7, 9) - must use ipxe.efi, not undionly.kpxe
dhcp-match=set:efi-x86_64,option:client-arch,7
dhcp-match=set:efi-x86_64,option:client-arch,9
dhcp-boot=tag:efi-x86_64,ipxe.efi

# iPXE chainload detection - serve bootimus menu
dhcp-match=set:ipxe,175
dhcp-boot=tag:ipxe,http://10.0.0.1:8000/bootimus/bootimus.ipxe

# iPXE options
dhcp-option-force=tag:ipxe,209,"bootimus/bootimus.ipxe"
dhcp-option-force=tag:ipxe,210,"http://10.0.0.1:8000/"

# LuciVerse provisioning options
dhcp-option=224,10.0.0.1
dhcp-option=225,9999
dhcp-option=226,8000

# ---- Static Hosts (known devices) ----

# USW-Pro-48-PoE currently managed on LAN (192.168.1.105)
# OOB target-state (when migrated back to 10.0.0.x):
# dhcp-host=24:5a:4c:9d:0f:8b,10.0.0.2,usw-pro-48,infinite

# Dell R210 II - iDRAC6 Enterprise (port 2, 1GbE)
dhcp-host=d0:67:e5:ec:d6:a2,10.0.0.30,r210ii-idrac,infinite

# Dell R210 II - Data NIC (port 52, 10GbE SFP+ via FS SFP-10G-T)
dhcp-host=d0:67:e5:ec:d6:a0,10.0.0.31,r210ii-data,infinite

# QLogic NIC - likely TrueNAS (port 3, 10 Mbps)
dhcp-host=00:0e:1e:bc:7c:a2,10.0.0.20,truenas-oob,infinite

# ---- DNS Names ----
address=/zbook.oob.lucidigital.net/10.0.0.1
address=/provision.oob.lucidigital.net/10.0.0.1
address=/pxe.oob.lucidigital.net/10.0.0.1
address=/usw-pro-48.oob.lucidigital.net/192.168.1.105
address=/truenas.oob.lucidigital.net/10.0.0.20
address=/r210ii-idrac.oob.lucidigital.net/10.0.0.30
address=/r210ii.oob.lucidigital.net/10.0.0.31

# UniFi Network Server - resolves "unifi" for device adoption
address=/unifi/10.0.0.1
address=/unifi.oob.lucidigital.net/10.0.0.1

# ---- Logging ----
log-dhcp
log-queries
log-facility=/var/log/dnsmasq-oob.log

# Run as root for TFTP access
user=root
