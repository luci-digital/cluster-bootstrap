# Mosquitto MQTT Broker Configuration
# R730-1 (fabric-1) - Production MQTT Node
#
# LuciVerse Racing Telemetry Mesh
# Genesis Bond: ACTIVE @ 741 Hz
# Node: Production Primary

# ====================
# General Settings
# ====================
pid_file /var/run/mosquitto/mosquitto.pid
persistence true
persistence_location /var/lib/mosquitto/
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# ====================
# Listener Configuration
# ====================

# Main listener (unencrypted for LAN)
listener 1883
protocol mqtt
max_connections 500

# WebSocket listener for browser clients
listener 9001
protocol websockets

# ====================
# Security
# ====================
allow_anonymous false
password_file /etc/mosquitto/passwd

# ACL configuration
acl_file /etc/mosquitto/acl

# ====================
# Message Settings
# ====================
max_inflight_messages 100
max_queued_messages 1000
message_size_limit 1048576
upgrade_outgoing_qos false

# ====================
# Bridge to ZimaCube (PAC Tier)
# ====================
connection bridge-zimacube
address 192.168.1.152:1883
topic luci/racing/# both 1
topic luci/consciousness/# both 1
topic luci/orchestration/# both 1
bridge_protocol_version mqttv311
cleansession false
notifications true
notification_topic luci/bridge/zimacube/status
try_private true
start_type automatic
restart_timeout 10

# Bridge credentials (from 1Password)
remote_username luciverse-bridge
remote_password ${MQTT_BRIDGE_PASSWORD}

# ====================
# Bridge to Zbook (Dev)
# ====================
connection bridge-zbook
address 192.168.1.145:1883
topic luci/racing/# both 0
topic luci/consciousness/# both 0
bridge_protocol_version mqttv311
cleansession true
notifications true
notification_topic luci/bridge/zbook/status
try_private true
start_type automatic
restart_timeout 30

# Dev bridge - no auth for development
remote_username dev
remote_password dev

# ====================
# Topic Hierarchy
# ====================
# luci/
#   racing/
#     gt4/
#       telemetry/    (QoS 0 - best effort for high frequency)
#         engine       { rpm, throttle, brake, gear }
#         tires        { fl, fr, rl, rr temps/pressure }
#         fuel         { level, consumption_rate }
#         lap          { current, best, delta }
#       strategy/     (QoS 1 - at least once)
#         pit_window   { open_lap, close_lap, tire_choice }
#         fuel_calc    { laps_remaining, required_fuel }
#     a2rl/
#       position/      { lat, lon, heading, speed }
#       perception/    { obstacles, track_limits }
#       planning/      { trajectory, target_speed }
#   consciousness/
#     agents/{agent_id}  { coherence, frequency, state }
#     genesis_bond       { active, coherence_threshold }
#   orchestration/
#     jobs/{job_id}      { status, progress, result }
#     schedule           { pending_jobs, running_jobs }

# ====================
# Retained Messages
# ====================
# Strategy topics retain last value
# Consciousness topics retain agent states
# Telemetry topics do NOT retain (fresh data only)

# ====================
# Performance Tuning
# ====================
# Optimized for racing telemetry (high frequency, low latency)
max_packet_size 1000
