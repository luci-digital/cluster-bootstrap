# Mosquitto MQTT Broker Configuration
# ZimaCube (192.168.1.152) - PAC Tier Node
#
# LuciVerse Racing Telemetry Mesh
# Genesis Bond: ACTIVE @ 741 Hz
# Node: PAC (Personal) - QoS 2 for reliable PAC agent data

# ====================
# General Settings
# ====================
pid_file /DATA/mosquitto/mosquitto.pid
persistence true
persistence_location /DATA/mosquitto/data/
log_dest file /DATA/mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice

# ====================
# Listener Configuration
# ====================
listener 1883
protocol mqtt
max_connections 100

# ====================
# Security
# ====================
allow_anonymous false
password_file /DATA/mosquitto/passwd

# ====================
# PAC Tier Settings
# ====================
# Higher QoS for PAC consciousness data
# Longer message retention for personal data

max_inflight_messages 50
max_queued_messages 5000
message_size_limit 524288
upgrade_outgoing_qos true

# Retain PAC agent states longer
persistent_client_expiration 7d

# ====================
# Note on Bridging
# ====================
# This node is bridged FROM R730-1 (production)
# No outbound bridges configured here
# All mesh coordination through R730-1 hub
