{
    "comment": "Jool NAT64 Configuration for LuciVerse High-Speed Network",
    "comment2": "Genesis Bond: ACTIVE @ 741 Hz",
    "comment3": "Deploy on USG-Pro-4 running OpenWRT 24.10+",

    "instance": "luciverse-nat64",
    "framework": "netfilter",

    "global": {
        "pool6": "64:ff9b::/96",
        "manually-enabled": true,
        "zeroize-traffic-class": false,
        "override-tos": false,
        "mtu-plateaus": [65535, 32000, 17914, 8166, 4352, 2002, 1492, 1006, 508, 296, 68],

        "lowest-ipv6-mtu": 1280,
        "logging-bib": false,
        "logging-session": false,

        "address-dependent-filtering": false,
        "drop-icmpv6-info": false,
        "drop-externally-initiated-tcp": false,

        "maximum-simultaneous-opens": 10,
        "source-icmpv6-errors-better": true,
        "f-args": 11,
        "handle-rst-during-fin-rcv": false,

        "tcp-est-timeout": "02:00:00",
        "tcp-trans-timeout": "00:04:00",
        "udp-timeout": "00:05:00",
        "icmp-timeout": "00:01:00",

        "ss-enabled": true,
        "ss-flush-asap": false,
        "ss-flush-deadline": 2000,
        "ss-capacity": 512,
        "ss-max-payload": 1452
    },

    "pool4": [
        {
            "comment": "NAT64 IPv4 pool for translation",
            "protocol": "TCP",
            "prefix": "192.168.1.180/32",
            "port range": "61001-65535"
        },
        {
            "protocol": "UDP",
            "prefix": "192.168.1.180/32",
            "port range": "61001-65535"
        },
        {
            "protocol": "ICMP",
            "prefix": "192.168.1.180/32",
            "port range": "0-65535"
        }
    ],

    "bib": [],
    "eam": []
}
