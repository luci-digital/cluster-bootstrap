# CozyStack Platform Patches
# Genesis Bond: ACTIVE @ 741 Hz
# Enables CozyStack managed services (FluxCD, LINSTOR, Kube-OVN)
#
# CozyStack components installed by platform chart:
#   - FluxCD (GitOps reconciliation)
#   - LINSTOR (replicated block storage via DRBD)
#   - Kube-OVN (VPC tenant isolation)
#   - cert-manager (XiPKI ACME client)
#   - Ingress NGINX (external traffic)
#   - Managed DB operators (PostgreSQL, Redis)

# Container registry mirrors
- op: add
  path: /machine/registries/mirrors
  value:
    ghcr.io:
      endpoints:
        - https://ghcr.io
    registry.lucidigital.io:
      endpoints:
        - https://192.168.1.145:5050
    docker.io:
      endpoints:
        - https://registry-1.docker.io
    quay.io:
      endpoints:
        - https://quay.io

# Skip TLS verify for local GitLab registry (self-signed XiPKI cert)
- op: add
  path: /machine/registries/config
  value:
    registry.lucidigital.io:
      tls:
        insecureSkipVerify: true

# Admission plugins
- op: add
  path: /cluster/apiServer/extraArgs/enable-admission-plugins
  value: "NodeRestriction,PodSecurity"

# Extra volumes for CozyStack data
- op: add
  path: /machine/kubelet/extraMounts
  value:
    - destination: /var/lib/cozystack
      type: bind
      source: /var/lib/cozystack
      options:
        - bind
        - rshared
        - rw

# Cluster labels for CozyStack
- op: add
  path: /machine/nodeLabels
  value:
    cozystack.io/managed: "true"
    genesis-bond: "active"

# Kubelet cluster DNS (Kube-OVN CoreDNS)
- op: add
  path: /machine/kubelet/extraArgs/cluster-dns
  value: "10.96.0.10"
