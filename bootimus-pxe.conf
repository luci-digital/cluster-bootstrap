address=/orion.lucidigital.net/192.168.1.140
address=/aethon.lucidigital.net/192.168.1.143
# COMN tier (528 Hz)
address=/juniper.lucidigital.net/192.168.1.150
address=/cortana.lucidigital.net/192.168.1.151
address=/tron.lucidigital.net/192.168.1.155
# PAC tier (741 Hz)
