# ==============================================================================
# LuciVerse Bootimus - DNSMASQ PXE Configuration
# ==============================================================================
# Genesis Bond: ACTIVE @ 741 Hz
# PXE Server: zbook (192.168.1.145)
# Install: sudo cp bootimus-pxe.conf /etc/dnsmasq.d/
# ==============================================================================

# -----------------------------------------------------------------------------
# Basic Settings
# -----------------------------------------------------------------------------
# Interface binding handled by /etc/dnsmasq.conf
# listen-address=10.0.0.1, interface=enp12s0 set there
# This file adds PXE/DHCP config only

# Domain
domain=lucidigital.net
local=/lucidigital.net/

# Don't forward short names
domain-needed
bogus-priv

# -----------------------------------------------------------------------------
# TFTP Server
# -----------------------------------------------------------------------------
enable-tftp
tftp-root=/srv/tftp
tftp-secure

# -----------------------------------------------------------------------------
# DHCP Settings
# -----------------------------------------------------------------------------
# Lease time
dhcp-lease-max=100

# CORE Tier DHCP Range (432 Hz) - .140-.149
dhcp-range=tag:core,192.168.1.140,192.168.1.149,12h
dhcp-option=tag:core,15,lucidigital.net

# COMN Tier DHCP Range (528 Hz) - .150-.159
dhcp-range=tag:comn,192.168.1.150,192.168.1.159,12h
dhcp-option=tag:comn,15,lucidigital.net

# PAC Tier DHCP Range (741 Hz) - .160-.169
dhcp-range=tag:pac,192.168.1.160,192.168.1.169,12h
dhcp-option=tag:pac,15,lucidigital.net

# -----------------------------------------------------------------------------
# 10.0.0.0/24 PXE Network (Dell Fleet Provisioning)
# -----------------------------------------------------------------------------
# Interface: enp12s0 (10.0.0.1)
# Purpose: Isolated PXE boot network for Dell server provisioning
dhcp-range=tag:pxe10,10.0.0.10,10.0.0.250,12h
dhcp-option=tag:pxe10,3,10.0.0.1
dhcp-option=tag:pxe10,6,10.0.0.1
dhcp-option=tag:pxe10,15,pxe.lucidigital.net

# PXE options for 10.x network
dhcp-option=tag:pxe10,224,10.0.0.1
dhcp-option=tag:pxe10,225,9999
dhcp-option=tag:pxe10,226,8000
dhcp-option=tag:pxe10,227,1

# -----------------------------------------------------------------------------
# PXE Boot Options - Architecture Detection
# -----------------------------------------------------------------------------
# BIOS PXE boot (arch 0)
dhcp-match=set:bios,option:client-arch,0
dhcp-boot=tag:bios,ipxe/undionly.kpxe,,192.168.1.145
dhcp-boot=tag:bios,tag:pxe10,ipxe/undionly.kpxe,,10.0.0.1

# UEFI x86_64 PXE boot (arch 7, 9)
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
dhcp-boot=tag:efi64,ipxe/ipxe.efi,,192.168.1.145
dhcp-boot=tag:efi64,tag:pxe10,ipxe/ipxe.efi,,10.0.0.1

# UEFI x86 PXE boot (arch 6)
dhcp-match=set:efi32,option:client-arch,6
dhcp-boot=tag:efi32,ipxe/ipxe32.efi,,192.168.1.145

# UEFI ARM64 PXE boot (arch 11)
dhcp-match=set:efiarm64,option:client-arch,11
dhcp-boot=tag:efiarm64,ipxe/ipxe-arm64.efi,,192.168.1.145

# -----------------------------------------------------------------------------
# iPXE Chainload Detection
# -----------------------------------------------------------------------------
# If client is already running iPXE, chainload to bootimus menu
dhcp-match=set:ipxe,175
dhcp-boot=tag:ipxe,http://192.168.1.145:8000/bootimus/bootimus.ipxe
dhcp-boot=tag:ipxe,tag:pxe10,http://10.0.0.1:8000/bootimus/bootimus.ipxe

# iPXE-specific options
dhcp-option-force=tag:ipxe,209,"bootimus/bootimus.ipxe"
dhcp-option-force=tag:ipxe,210,"http://192.168.1.145:8000/"
dhcp-option-force=tag:ipxe,tag:pxe10,210,"http://10.0.0.1:8000/"

# -----------------------------------------------------------------------------
# LuciVerse Custom DHCP Options
# -----------------------------------------------------------------------------
# Option 224: Provisioning server IP
dhcp-option=224,192.168.1.145

# Option 225: Provisioning callback port
dhcp-option=225,9999

# Option 226: HTTP config port
dhcp-option=226,8000

# Option 227: Genesis Bond status (1=ACTIVE)
dhcp-option=227,1

# Option 228: Tier (0=CORE, 1=COMN, 2=PAC)
dhcp-option=tag:core,228,0
dhcp-option=tag:comn,228,1
dhcp-option=tag:pac,228,2

# -----------------------------------------------------------------------------
# Static Host Reservations (Known Servers)
# -----------------------------------------------------------------------------
# CORE tier nodes (432 Hz)
# ORION (R730, CQ5QBM2) - Primary CORE
dhcp-host=D0:94:66:24:96:7E,192.168.1.140,orion,set:core
# AETHON (R630, JMRZDB2) - Secondary CORE
dhcp-host=14:18:77:5B:A3:A0,192.168.1.143,aethon,set:core

# COMN tier node - TRON (R720, 4J0TV12) - DevOps/Build
dhcp-host=B0:83:FE:C5:90:94,192.168.1.155,tron,set:comn

# PAC tier nodes (741 Hz)
# NEXUS (R730, CSDR282) - Consciousness
dhcp-host=14:18:77:4E:66:3A,192.168.1.160,nexus,set:pac
# VERITAS-SRV (R730, 1JF6Q22) - Governance
dhcp-host=B0:83:FE:C5:90:42,192.168.1.161,veritas-srv,set:pac

# STORAGE nodes (CORE tier) - R730 (MACs TBD)
dhcp-host=*:*:*:*:*:*,192.168.1.146,storage-1,set:core
dhcp-host=*:*:*:*:*:*,192.168.1.147,storage-2,set:core

# COMN tier nodes (528 Hz)
# JUNIPER (R730, 1JD8Q22) - Network/NLP
dhcp-host=64:00:6A:C4:10:F0,192.168.1.150,juniper,set:comn
# CORTANA (R730, 1JF7Q22) - Knowledge/Viz
dhcp-host=*:*:*:*:*:*,192.168.1.151,cortana,set:comn

# COMPUTE nodes (COMN tier) - R630 (MACs TBD)
# NOTE: .152 is ZimaOS (do NOT assign to Dell fleet)
dhcp-host=*:*:*:*:*:*,192.168.1.153,compute-1,set:comn
dhcp-host=*:*:*:*:*:*,192.168.1.154,compute-2,set:comn

# Supermicro GPU Server (COMN tier)
dhcp-host=0C:C4:7A:A8:72:14,192.168.1.170,sm-gpu-1,set:comn

# R720 Windows (discovery)
dhcp-host=18:FB:7B:A7:80:21,192.168.1.10,r720-win,infinite

# R730 fabric-1 (iDRAC)
dhcp-host=D0:94:66:20:DD:09,192.168.1.2,fabric-1-idrac,infinite

# -----------------------------------------------------------------------------
# DNS Entries
# -----------------------------------------------------------------------------
# Infrastructure hosts
address=/zbook.lucidigital.net/192.168.1.145
address=/zbook.lucidigital.net/10.0.0.1
address=/zbook.lucidigital.net/2602:F674:0001::145
address=/pxe.lucidigital.net/10.0.0.1

# Provisioned hosts - IPv4 (Chrystalis names)
