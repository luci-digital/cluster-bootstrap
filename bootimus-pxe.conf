# IPv6 addresses (CORE tier - 2602:F674:0001:{last_octet}::1 per-host /64)
address=/orion.lucidigital.net/2602:F674:0001:0140::1
address=/aethon.lucidigital.net/2602:F674:0001:0143::1

# IPv6 addresses (COMN tier - 2602:F674:0100:{last_octet}::1 per-host /64)
address=/juniper.lucidigital.net/2602:F674:0100:0150::1
address=/cortana.lucidigital.net/2602:F674:0100:0151::1
address=/tron.lucidigital.net/2602:F674:0100:0155::1

# IPv6 addresses (PAC tier - 2602:F674:0200:{last_octet}::1 per-host /64)
address=/nexus.lucidigital.net/2602:F674:0200:0160::1
address=/veritas-srv.lucidigital.net/2602:F674:0200:0161::1

# Legacy unassigned
address=/storage-1.lucidigital.net/2602:F674:0001:0146::1
address=/storage-2.lucidigital.net/2602:F674:0001:0147::1
address=/sm-gpu-1.lucidigital.net/2602:F674:0100:0170::1

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
log-queries
log-dhcp
log-facility=/var/log/dnsmasq-bootimus.log

# ==============================================================================
# Installation Notes:
#
# 1. Copy this file to /etc/dnsmasq.d/
#    sudo cp bootimus-pxe.conf /etc/dnsmasq.d/
#
# 2. Ensure TFTP directory exists and has boot files:
#    sudo mkdir -p /srv/tftp/ipxe
#    sudo curl -o /srv/tftp/ipxe/undionly.kpxe https://boot.ipxe.org/undionly.kpxe
#    sudo curl -o /srv/tftp/ipxe/ipxe.efi https://boot.ipxe.org/ipxe.efi
#
# 3. Download openEuler netboot images:
#    sudo mkdir -p /srv/tftp/openeuler
#    MIRROR=https://repo.openeuler.org/openEuler-25.09/OS/x86_64/images/pxeboot
#    sudo curl -o /srv/tftp/openeuler/vmlinuz ${MIRROR}/vmlinuz
#    sudo curl -o /srv/tftp/openeuler/initrd.img ${MIRROR}/initrd.img
#
# 4. Restart dnsmasq:
#    sudo systemctl restart dnsmasq
#
# 5. Open firewall ports:
#    sudo firewall-cmd --permanent --add-service=tftp
#    sudo firewall-cmd --permanent --add-service=dhcp
#    sudo firewall-cmd --reload
# ==============================================================================
